name: Propuesta de manual o mejora
description: Sugiere un manual nuevo, una ampliación o una mejora del sitio
title: "[Propuesta] "
labels: ["enhancement"]
body:
  - type: textarea
    id: propuesta
    attributes:
      label: ¿Qué propones?
      description: Tecnología o tema, y qué cubriría.
    validations:
      required: true
  - type: textarea
    id: motivo
    attributes:
      label: ¿Por qué encaja en Atelier?
      description: A quién ayudaría y qué aporta frente a lo que ya hay.
    validations:
      required: true
  - type: checkboxes
    id: colaboracion
    attributes:
      label: Colaboración
      options:
        - label: Me gustaría redactarlo yo y enviar un Pull Request
