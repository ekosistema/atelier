name: Desplegar sitio

on:
  push:
    branches: [main]
    paths: ['sources/**', 'README.md', 'site/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Comprobar documentación
        run: node scripts/check-docs.mjs
      - name: Instalar dependencias del sitio
        run: npm ci
        working-directory: site
      - name: Compilar
        run: npm run build
        working-directory: site
        env:
          # Dominio propio del sitio: la base queda vacía.
          SITE_URL: https://atelier.celerolab.com
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
